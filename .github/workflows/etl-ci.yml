name: etl-ci

on:
  pull_request:
    paths:
      - 'etl-meals/**'
      - '.github/workflows/etl-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'etl-meals/**'
      - '.github/workflows/etl-ci.yml'

defaults:
  run:
    working-directory: etl-meals

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q
