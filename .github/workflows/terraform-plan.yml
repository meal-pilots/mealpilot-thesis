name: terraform-plan

on:
  pull_request:
    paths:
      - 'infrastructure/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: eu-central-1
  TF_VERSION: '1.9.8'

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: terraform init -no-color

      - name: Terraform validate
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        continue-on-error: true
        run: terraform plan -no-color -input=false -out=tfplan

      - name: Comment plan summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const env = '${{ matrix.environment }}';
            const status = '${{ steps.plan.outcome }}';
            const body = `### Terraform plan: \`${env}\`\nOutcome: **${status}**`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
