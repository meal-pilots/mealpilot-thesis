[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [
    "**/migrations/**",
    "staticfiles",
    "media",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "PIE",
    "PL",
    "RUF",
    "DJ",
]
ignore = [
    "E501",
    "PLR0913",
    "PLR2004",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "DJ001",
    "B904",
    "RUF012",
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict_optional = false
warn_unused_ignores = false
ignore_missing_imports = true
exclude = [
    "migrations",
    ".venv",
    "staticfiles",
]

[tool.django-stubs]
django_settings_module = "config.settings.dev"
