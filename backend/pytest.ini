[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = tests.py test_*.py *_tests.py
addopts = -ra --strict-markers --strict-config --tb=short
filterwarnings =
    ignore::DeprecationWarning:rest_framework_simplejwt.*
    ignore::DeprecationWarning:django.utils.deprecation
markers =
    integration: end-to-end API tests touching the whole stack
    unit: focused unit tests
    slow: tests that exceed 1s on CI
testpaths = apps
